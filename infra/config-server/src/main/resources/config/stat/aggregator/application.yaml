grpc:
  server:
    port: 0

server:
  port: 0

kafka:
  consumer:
    properties:
      bootstrap.servers: localhost:9092
      key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value.deserializer: ru.practicum.serializer.UserActionDeserializer
      group.id: agg-action-group
  producer:
    properties:
      bootstrap.servers: localhost:9092
      key.serializer: org.apache.kafka.common.serialization.StringSerializer
      value.serializer: ru.practicum.serializer.GeneralAvroSerializer
      batch.size: 120
      linger.ms: 6500 #не успевала собраться вся пачка сообщений
  topics:
    user-actions: stats.user-actions.v1
    events-similarity: stats.events-similarity.v1